name: Deploy to GitHub Pages

# デフォルトブランチへ push（または手動実行）でビルドして GitHub Pages へ公開する。
#
# 【初回のみ手動設定が必要】
#   GitHub のセキュリティ仕様により、Actions の標準トークンでは初回の Pages 有効化が
#   できません。リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」に一度だけ設定してください。以降は push で自動デプロイされます。
#   設定ページ: https://github.com/bakedrecords/td/settings/pages
#
# 公開 URL: https://bakedrecords.github.io/td/

on:
  push:
    branches:
      - main
      - claude/relaxed-brahmagupta-OA5am
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 つに絞る（後発を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
