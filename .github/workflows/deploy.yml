name: Deploy to GitHub Pages

# main にプッシュされたらビルドして GitHub Pages へ公開する。
# 手動実行（workflow_dispatch）でもデプロイ可能。
#
# 初回のみリポジトリ設定が必要:
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」に変更
# 公開 URL: https://<ユーザー名>.github.io/td/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 つに絞る（後発を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
