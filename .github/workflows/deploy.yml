name: Deploy to GitHub Pages

# デフォルトブランチへ push するとビルドして GitHub Pages へ公開する。
# configure-pages の enablement で Pages 自体も自動で有効化を試みるため、
# 通常はリポジトリ設定を手動で触る必要はない。
# （もし権限の都合で自動有効化に失敗した場合のみ、
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にして再実行）
# 公開 URL: https://bakedrecords.github.io/td/

on:
  push:
    branches:
      - main
      - claude/relaxed-brahmagupta-OA5am
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 つに絞る（後発を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages（未有効なら自動で有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
